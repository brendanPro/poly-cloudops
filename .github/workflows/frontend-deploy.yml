name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  PROJECT_ID: polycloudops
  REPOSITORY: n8n-repo
  IMAGE: frontend
  SERVICE: frontend-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required frontend webhook secrets
        run: |
          missing=0

          for name in \
            N8N_TRANSLATE_WEBHOOK_URL \
            N8N_QR_WEBHOOK_URL \
            N8N_JSON_EXCEL_WEBHOOK_URL \
            N8N_SUMMARIZE_WEBHOOK_URL \
            N8N_WEATHER_WEBHOOK_URL \
            N8N_CURRENCY_WEBHOOK_URL
          do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          N8N_TRANSLATE_WEBHOOK_URL: ${{ secrets.N8N_TRANSLATE_WEBHOOK_URL }}
          N8N_QR_WEBHOOK_URL: ${{ secrets.N8N_QR_WEBHOOK_URL }}
          N8N_JSON_EXCEL_WEBHOOK_URL: ${{ secrets.N8N_JSON_EXCEL_WEBHOOK_URL }}
          N8N_SUMMARIZE_WEBHOOK_URL: ${{ secrets.N8N_SUMMARIZE_WEBHOOK_URL }}
          N8N_WEATHER_WEBHOOK_URL: ${{ secrets.N8N_WEATHER_WEBHOOK_URL }}
          N8N_CURRENCY_WEBHOOK_URL: ${{ secrets.N8N_CURRENCY_WEBHOOK_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          DOCKER_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
          docker build \
            -t "${DOCKER_IMAGE}:latest" \
            -t "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            ./frontend

      - name: Push Docker image
        run: |
          DOCKER_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
          docker push "${DOCKER_IMAGE}:latest"
          docker push "${DOCKER_IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          DOCKER_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"

          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --image "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            --port 3000 \
            --set-env-vars "N8N_TRANSLATE_WEBHOOK_URL=${N8N_TRANSLATE_WEBHOOK_URL},N8N_QR_WEBHOOK_URL=${N8N_QR_WEBHOOK_URL},N8N_JSON_EXCEL_WEBHOOK_URL=${N8N_JSON_EXCEL_WEBHOOK_URL},N8N_SUMMARIZE_WEBHOOK_URL=${N8N_SUMMARIZE_WEBHOOK_URL},N8N_WEATHER_WEBHOOK_URL=${N8N_WEATHER_WEBHOOK_URL},N8N_CURRENCY_WEBHOOK_URL=${N8N_CURRENCY_WEBHOOK_URL}"

          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        env:
          N8N_TRANSLATE_WEBHOOK_URL: ${{ secrets.N8N_TRANSLATE_WEBHOOK_URL }}
          N8N_QR_WEBHOOK_URL: ${{ secrets.N8N_QR_WEBHOOK_URL }}
          N8N_JSON_EXCEL_WEBHOOK_URL: ${{ secrets.N8N_JSON_EXCEL_WEBHOOK_URL }}
          N8N_SUMMARIZE_WEBHOOK_URL: ${{ secrets.N8N_SUMMARIZE_WEBHOOK_URL }}
          N8N_WEATHER_WEBHOOK_URL: ${{ secrets.N8N_WEATHER_WEBHOOK_URL }}
          N8N_CURRENCY_WEBHOOK_URL: ${{ secrets.N8N_CURRENCY_WEBHOOK_URL }}

      - name: Publish deployment summary
        run: |
          {
            echo "## Frontend Deployment"
            echo ""
            echo "- **Service:** ${SERVICE}"
            echo "- **Region:** ${REGION}"
            echo "- **Image:** ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required frontend webhook secrets
        run: |
          missing=0

          for name in \
            N8N_TRANSLATE_WEBHOOK_URL \
            N8N_QR_WEBHOOK_URL \
            N8N_JSON_EXCEL_WEBHOOK_URL \
            N8N_SUMMARIZE_WEBHOOK_URL \
            N8N_WEATHER_WEBHOOK_URL \
            N8N_CURRENCY_WEBHOOK_URL
          do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          N8N_TRANSLATE_WEBHOOK_URL: ${{ secrets.N8N_TRANSLATE_WEBHOOK_URL }}
          N8N_QR_WEBHOOK_URL: ${{ secrets.N8N_QR_WEBHOOK_URL }}
          N8N_JSON_EXCEL_WEBHOOK_URL: ${{ secrets.N8N_JSON_EXCEL_WEBHOOK_URL }}
          N8N_SUMMARIZE_WEBHOOK_URL: ${{ secrets.N8N_SUMMARIZE_WEBHOOK_URL }}
          N8N_WEATHER_WEBHOOK_URL: ${{ secrets.N8N_WEATHER_WEBHOOK_URL }}
          N8N_CURRENCY_WEBHOOK_URL: ${{ secrets.N8N_CURRENCY_WEBHOOK_URL }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Dagger
        uses: dagger/dagger-action@v7
        with:
          version: "0.19.10"

      - name: Deploy frontend via Dagger
        id: deploy
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          N8N_TRANSLATE_WEBHOOK_URL: ${{ secrets.N8N_TRANSLATE_WEBHOOK_URL }}
          N8N_QR_WEBHOOK_URL: ${{ secrets.N8N_QR_WEBHOOK_URL }}
          N8N_JSON_EXCEL_WEBHOOK_URL: ${{ secrets.N8N_JSON_EXCEL_WEBHOOK_URL }}
          N8N_SUMMARIZE_WEBHOOK_URL: ${{ secrets.N8N_SUMMARIZE_WEBHOOK_URL }}
          N8N_WEATHER_WEBHOOK_URL: ${{ secrets.N8N_WEATHER_WEBHOOK_URL }}
          N8N_CURRENCY_WEBHOOK_URL: ${{ secrets.N8N_CURRENCY_WEBHOOK_URL }}
        run: |
          URL="$(dagger call deploy-frontend \
            --google-oauth-access-token env:GOOGLE_OAUTH_ACCESS_TOKEN \
            --commit-sha "${{ github.sha }}" \
            --n8n-translate-webhook-url env:N8N_TRANSLATE_WEBHOOK_URL \
            --n8n-qr-webhook-url env:N8N_QR_WEBHOOK_URL \
            --n8n-json-excel-webhook-url env:N8N_JSON_EXCEL_WEBHOOK_URL \
            --n8n-summarize-webhook-url env:N8N_SUMMARIZE_WEBHOOK_URL \
            --n8n-weather-webhook-url env:N8N_WEATHER_WEBHOOK_URL \
            --n8n-currency-webhook-url env:N8N_CURRENCY_WEBHOOK_URL \
            --progress=plain)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        run: |
          {
            echo "## Frontend Deployment"
            echo ""
            echo "- **Service:** frontend-service"
            echo "- **Region:** europe-west1"
            echo "- **Image:** europe-west1-docker.pkg.dev/polycloudops/n8n-repo/frontend:${{ github.sha }}"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Terraform CI/CD Pipeline
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - default
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  terraform-validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: '600s'
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"
          terraform_wrapper: true
      
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: Terraform Init
        id: init
        run: terraform init
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      - name: Terraform Validate
        id: validate
        run: terraform validate
        env:
          FORCE_COLOR: "1"
      # DYNAMIC WORKSPACE & SERVICE NAME SELECTION
      - name: Select Terraform Workspace & Service Name
        id: workspace
        run: |
          # Determine environment: workflow_dispatch input takes precedence, otherwise use branch
          if [[ -n "${{ github.event.inputs.environment }}" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="default"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            ENV="staging"
          else
            ENV="staging"
          fi
          
          if [[ "$ENV" == "default" ]]; then
            echo "Selecting 'default' workspace (production)."
            terraform workspace select default
            echo "workspace=default" >> $GITHUB_OUTPUT
            echo "service_name=n8n-service" >> $GITHUB_OUTPUT
          elif [[ "$ENV" == "staging" ]]; then
            echo "Selecting 'staging' workspace."
            terraform workspace select staging || terraform workspace new staging
            echo "workspace=staging" >> $GITHUB_OUTPUT
            echo "service_name=n8n-service-staging" >> $GITHUB_OUTPUT
          fi
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TF_VAR_n8n_admin_password: ${{ secrets.N8N_ADMIN_PASSWORD }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          # Fix: Pass dynamic service name to prevent conflicts
          TF_VAR_cloudrun_service_name: ${{ steps.workspace.outputs.service_name }}
      
      - name: Encrypt Plan
        run: |
          gpg --symmetric --batch --passphrase "${{ secrets.PLAN_ENCRYPTION_KEY }}" --output tfplan.gpg tfplan
          
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.workspace.outputs.workspace }}
          path: terraform/tfplan.gpg
          retention-days: 1
      
      - name: Comment PR with Terraform Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          FMT_OUTCOME: "${{ steps.fmt.outcome }}"
          INIT_OUTCOME: "${{ steps.init.outcome }}"
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
          PLAN_OUTCOME: "${{ steps.plan.outcome }}"
          WORKSPACE: "${{ steps.workspace.outputs.workspace }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌️ \`${process.env.FMT_OUTCOME}\`
            #### Terraform Initialization ⚙️ \`${process.env.INIT_OUTCOME}\`
            #### Terraform Validation 🤖 \`${process.env.VALIDATE_OUTCOME}\`
            #### Terraform Plan 📖 \`${process.env.PLAN_OUTCOME}\`
            #### Terraform Workspace 🌍 \`${process.env.WORKSPACE}\`
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Validation Results
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: |
          echo "::error::Terraform validation failed. Please fix the errors above."
          exit 1
  
  # JOB 2: DEPLOY TO STAGING (AUTOMATIC)
  terraform-deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment: staging
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: '1200s'
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"
          terraform_wrapper: true
      
      - name: Terraform Init
        run: terraform init
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      - name: Select Staging Workspace
        run: terraform workspace select staging || terraform workspace new staging
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-staging
          path: terraform
      - name: Decrypt Plan
        run: |
          gpg --decrypt --batch --passphrase "${{ secrets.PLAN_ENCRYPTION_KEY }}" --output tfplan tfplan.gpg
      - name: Terraform Apply Staging
        run: |
          echo "::warning::Deploying infrastructure to STAGING environment..."
          terraform apply -input=false tfplan
          echo "::notice::Staging Deployment completed successfully."
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TF_VAR_n8n_admin_password: ${{ secrets.N8N_ADMIN_PASSWORD }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          # Fix: Force unique name for Staging
          TF_VAR_cloudrun_service_name: "n8n-service-staging"
          FORCE_COLOR: "1"
      
      - name: Deployment Summary
        if: success()
        run: |
          echo "::notice::✅ STAGING DEPLOYMENT SUCCESSFUL"
          terraform output
        env:
          FORCE_COLOR: "1"
  # JOB 3: DEPLOY TO PRODUCTION (MANUAL APPROVAL)
  terraform-deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'default'
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: '1200s'
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"
          terraform_wrapper: true
      
      - name: Terraform Init
        run: terraform init
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      - name: Select Production Workspace
        run: terraform workspace select default
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FORCE_COLOR: "1"
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-default
          path: terraform
      - name: Decrypt Plan
        run: |
          gpg --decrypt --batch --passphrase "${{ secrets.PLAN_ENCRYPTION_KEY }}" --output tfplan tfplan.gpg
      - name: Terraform Apply Production
        run: |
          echo "::warning::Deploying infrastructure to PRODUCTION environment..."
          terraform apply -input=false tfplan
          echo "::notice::Production Deployment completed successfully."
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TF_VAR_n8n_admin_password: ${{ secrets.N8N_ADMIN_PASSWORD }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          # Fix: Keep original name for Production
          TF_VAR_cloudrun_service_name: "n8n-service"
          FORCE_COLOR: "1"
      
      - name: Deployment Summary
        if: success()
        run: |
          echo "::notice::✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
          terraform output
        env:
          FORCE_COLOR: "1"
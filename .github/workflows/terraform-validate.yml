name: Terraform CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
      - 'src/**'
      - 'dagger.json'
      - 'tsconfig.json'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'src/**'
      - 'dagger.json'
      - 'tsconfig.json'
      - 'package.json'
  workflow_dispatch:  # Allow manual triggers

# Required for Workload Identity Federation
permissions:
  contents: read        # Read repository contents
  id-token: write      # Create OIDC tokens for GCP authentication
  pull-requests: write # Post comments on PRs

jobs:
  terraform-validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    
    steps:
      # ============================================================================
      # CHECKOUT CODE
      # ============================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # ============================================================================
      # AUTHENTICATE WITH GCP (WORKLOAD IDENTITY FEDERATION)
      # ============================================================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: '600s'  # 10 minutes (enough for plan)
      
      # ============================================================================
      # SETUP DAGGER
      # ============================================================================
      - name: Setup Dagger
        uses: dagger/dagger-action@v4
      
      # ============================================================================
      # DAGGER VALIDATE
      # ============================================================================
      - name: Dagger Validate
        id: validate
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          dagger call validate \
            --google-oauth-access-token env:GOOGLE_OAUTH_ACCESS_TOKEN \
            --progress=plain
      
      # ============================================================================
      # DAGGER PLAN
      # ============================================================================
      - name: Dagger Plan
        id: plan
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          N8N_ADMIN_PASSWORD: ${{ secrets.N8N_ADMIN_PASSWORD }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
        run: |
          PLAN_OUTPUT="$(dagger call plan \
            --google-oauth-access-token env:GOOGLE_OAUTH_ACCESS_TOKEN \
            --n8n-admin-password env:N8N_ADMIN_PASSWORD \
            --neon-api-key env:NEON_API_KEY \
            --neon-org-id env:NEON_ORG_ID)"
          {
            echo "stdout<<EOF"
            echo "$PLAN_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      
      # ============================================================================
      # POST PLAN RESULTS AS PR COMMENT
      # ============================================================================
      - name: Comment PR with Terraform Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
          PLAN_OUTCOME: "${{ steps.plan.outcome }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Dagger Validate 🤖 \`${process.env.VALIDATE_OUTCOME}\`
            #### Dagger Plan 📖 \`${process.env.PLAN_OUTCOME}\`
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
  
  # ==============================================================================
  # JOB 2: DEPLOY TO PRODUCTION (MANUAL APPROVAL)
  # ==============================================================================
  terraform-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: terraform-validate  # Runs only if validation succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only on merge to main
    environment: production  # Requires manual approval
    
    steps:
      # ============================================================================
      # CHECKOUT CODE
      # ============================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # ============================================================================
      # AUTHENTICATE WITH GCP (WORKLOAD IDENTITY FEDERATION)
      # ============================================================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: '1200s'  # 20 minutes (enough for apply)
      
      # ============================================================================
      # SETUP DAGGER
      # ============================================================================
      - name: Setup Dagger
        uses: dagger/dagger-action@v4
      
      # ============================================================================
      # DAGGER APPLY - THE ACTUAL DEPLOYMENT
      # ============================================================================
      - name: Dagger Apply
        run: |
          echo "::warning::Deploying infrastructure to GCP..."
          dagger call apply \
            --branch main \
            --google-oauth-access-token env:GOOGLE_OAUTH_ACCESS_TOKEN \
            --n8n-admin-password env:N8N_ADMIN_PASSWORD \
            --neon-api-key env:NEON_API_KEY \
            --neon-org-id env:NEON_ORG_ID \
            --progress=plain
          echo "::notice::Deployment completed successfully."
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          N8N_ADMIN_PASSWORD: ${{ secrets.N8N_ADMIN_PASSWORD }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
      
      # ============================================================================
      # POST-DEPLOYMENT SUMMARY
      # ============================================================================
      - name: Deployment Summary
        if: success()
        run: |
          echo "::notice::============================================"
          echo "::notice::✅ DEPLOYMENT SUCCESSFUL"
          echo "::notice::============================================"
          echo "::notice::Deployed by: ${{ github.actor }}"
          echo "::notice::Commit: ${{ github.sha }}"
          echo "::notice::============================================"
          echo "::notice::Terraform outputs are available via Dagger logs."

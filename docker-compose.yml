services:
  n8n:
    image: n8nio/n8n:2.10.4   
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SSL_ENABLED=${DB_POSTGRESDB_SSL_ENABLED}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false    
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PORT=5678
      - DEEPL_API_KEY=${DEEPL_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5

  db-bootstrap:
    image: postgres:17-alpine
    container_name: n8n-staging-db-setup
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./bootstrap/setup-n8n.sql:/scripts/setup-n8n.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:mode=0700
    environment:
      - PGPASSWORD=${DB_POSTGRESDB_PASSWORD}
      - ADMIN_EMAIL=${N8N_ADMIN_EMAIL:-admin@cloudops.com}
      - ADMIN_PASSWORD=${N8N_ADMIN_PASSWORD}
    command: >
      sh -c "psql \"host=${DB_POSTGRESDB_HOST} user=${DB_POSTGRESDB_USER} dbname=${DB_POSTGRESDB_DATABASE} sslmode=require\" 
      -v admin_email=\"$$ADMIN_EMAIL\" 
      -v admin_password=\"$$ADMIN_PASSWORD\" 
      -f /scripts/setup-n8n.sql"
    restart: "no"
volumes:
  n8n_data:
    driver: local

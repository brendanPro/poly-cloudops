services:
  n8n:
    image: n8nio/n8n:latest   
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:   
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${PGHOST}
      - DB_POSTGRESDB_DATABASE=${PGDATABASE}
      - DB_POSTGRESDB_USER=${PGUSER}
      - DB_POSTGRESDB_PASSWORD=${PGPASSWORD}
      - DB_POSTGRESDB_PORT=${PGPORT:-5432}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_POSTGRESDB_SSL_ENABLED=false
      - N8N_PORT=5678
      - DEEPL_API_KEY=${DEEPL_API_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    image: oven/bun:1.1-alpine
    container_name: n8n-bootstrap
    working_dir: /app
    volumes:
      - .:/app  
    env_file:
      - .env
    command: >
      sh -c "bun install && bun bootstrap/bootstrap.js"
    depends_on:
      n8n:
        condition: service_healthy
    restart: "no"
volumes:
  n8n_data:
    driver: local
  db_data:
    driver: local
